name: Build & Release Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Next.js Web Assets
        run: |
          npm run build || true
          mkdir -p out
          cat << 'EOF' > out/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
              <title>Claude Enterprise Mobile</title>
              <style>
                body { margin: 0; background: #121214; height: 100vh; overflow: hidden; }
                iframe { width: 100vw; height: 100vh; border: none; }
              </style>
            </head>
            <body>
              <iframe src="https://claude-enterprise-app.vercel.app" allow="camera; microphone; geolocation; clipboard-read; clipboard-write"></iframe>
            </body>
          </html>
          EOF

      - name: Install Capacitor CLI & Core
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap init "Claude Enterprise Mobile" "com.sameer.claudeenterprise" --web-dir out
          npx cap add android || true
          npx cap sync android

      - name: Build Debug Android APK with Gradle
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            # Fix duplicate kotlin-stdlib class conflicts across modern Capacitor & Android dependencies
            echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> app/build.gradle
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Locate & Verify Built APK
        id: locate-apk
        run: |
          APK_PATH=$(find android -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "Found APK at $APK_PATH"
          else
            echo "No APK generated via Gradle directly; creating mobile web distribution package."
          fi

      - name: Upload APK Artifact
        if: steps.locate-apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Enterprise-Mobile-APK
          path: ${{ steps.locate-apk.outputs.apk_path }}

      - name: Create GitHub Release with APK
        if: steps.locate-apk.outputs.apk_path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Claude Enterprise Mobile APK v1.0.${{ github.run_number }}"
          body: |
            ## 🚀 Claude Enterprise Mobile APK Update
            
            - **Build Number**: ${{ github.run_number }}
            - **Commit**: ${{ github.sha }}
            - Tap the attached `.apk` file below on your Android phone to install the upgrade directly.
          files: ${{ steps.locate-apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
