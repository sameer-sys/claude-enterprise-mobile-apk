name: Build & Release Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Next.js Web Assets
        run: |
          npm run build

      - name: Install Capacitor CLI & Core
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap init "Claude Enterprise Mobile" "com.sameer.claudeenterprise" --web-dir .next
          npx cap add android || true
          npx cap sync android

      - name: Build Debug Android APK with Gradle
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Locate & Verify Built APK
        id: locate-apk
        run: |
          APK_PATH=$(find android -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "Found APK at $APK_PATH"
          else
            echo "No APK generated via Gradle directly; creating mobile web distribution package."
          fi

      - name: Upload APK Artifact
        if: steps.locate-apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Enterprise-Mobile-APK
          path: ${{ steps.locate-apk.outputs.apk_path }}

      - name: Create GitHub Release with APK
        if: steps.locate-apk.outputs.apk_path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Claude Enterprise Mobile APK v1.0.${{ github.run_number }}"
          body: |
            ## 🚀 Claude Enterprise Mobile APK Update
            
            - **Build Number**: ${{ github.run_number }}
            - **Commit**: ${{ github.sha }}
            - Tap the attached `.apk` file below on your Android phone to install the upgrade directly.
          files: ${{ steps.locate-apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
